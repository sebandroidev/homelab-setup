name: watcharr
services:
  watcharr:
    image: ghcr.io/sbondco/watcharr:latest
    container_name: watcharr
    restart: unless-stopped
    ports:
      - "3201:3080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - JWT_SECRET=${WATCHARR_JWT_SECRET:-}
    volumes:
      - /opt/apps/watcharr/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
