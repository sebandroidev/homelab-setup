name: nas-controller
services:
  nas-controller:
    build: .
    image: nas-controller:latest
    container_name: nas-controller
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS:-}
      - NAVIDROME_URL=http://host.docker.internal:4533
      - NAVIDROME_USER=sebastien
      - NAVIDROME_PASS=sebastien
      - DOWNLOADS_DIR=/media/nas-hdd/Musics/Soulseek
      - SLSKD_URL=http://host.docker.internal:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_SECRET=${LASTFM_SECRET:-}
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN:-}
      - ORLY_JAMS_URL=http://host.docker.internal:7070
      - DEPLOY_SECRET=${DEPLOY_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /media/nas-hdd:/media/nas-hdd
      - /opt/apps/beets:/DATA/AppData/beets
      - /opt/apps/nas-controller:/DATA/AppData/nas-controller
      - /opt/apps/homelab-setup:/DATA/homelab-setup
      - /usr/bin/docker:/usr/bin/docker:ro
      - /opt/apps/navidrome:/DATA/AppData/navidrome
      - /media/nas-hdd/nas-migration-backup-20260506/AppData/beets/config:/beets-config:ro
      - ./data:/data
    dns:
      - 8.8.8.8
      - 1.1.1.1

  deploy-agent:
    build:
      context: ./deploy
      dockerfile: Dockerfile
    image: deploy-agent:latest
    container_name: deploy-agent
    restart: unless-stopped
    ports:
      - "8889:8889"
    environment:
      - DEPLOY_SECRET=${DEPLOY_SECRET:-}
    volumes:
      - /opt/apps/homelab-setup:/DATA/homelab-setup
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/apps/nas-controller/deploy:/deploy
      - /opt/apps/nas-controller:/DATA/AppData/nas-controller
      - /opt/apps/beets:/DATA/AppData/beets
      - /opt/apps/navidrome:/DATA/AppData/navidrome
      - /usr/bin/docker:/usr/bin/docker:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
